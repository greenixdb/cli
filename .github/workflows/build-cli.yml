name: Build CLI Tool

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            goos: windows
            platform: windows
            arch: amd64
            arch_dir: x64
            ext: .exe
          - os: ubuntu-latest
            goos: windows
            platform: windows
            arch: '386'
            arch_dir: x86
            ext: .exe
          - os: ubuntu-latest
            goos: windows
            platform: windows
            arch: arm64
            arch_dir: arm64
            ext: .exe
          - os: macos-latest
            goos: darwin
            platform: macos
            arch: amd64
            arch_dir: x64
            ext: ''
          - os: macos-latest
            goos: darwin
            platform: macos
            arch: arm64
            arch_dir: arm64
            ext: ''
          - os: ubuntu-latest
            goos: linux
            platform: linux
            arch: amd64
            arch_dir: x64
            ext: ''
          - os: ubuntu-latest
            goos: linux
            platform: linux
            arch: '386'
            arch_dir: x86
            ext: ''
          - os: ubuntu-latest
            goos: linux
            platform: linux
            arch: arm64
            arch_dir: arm64
            ext: ''

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache-dependency-path: cli/src/go.sum

      - name: Read version
        shell: bash
        run: |
          if [ -f version.properties ]; then
            source version.properties
            echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV
            echo "VERSION_CODE=$VERSION_CODE" >> $GITHUB_ENV
          else
            echo "VERSION_NAME=dev" >> $GITHUB_ENV
            echo "VERSION_CODE=0" >> $GITHUB_ENV
          fi

      - name: Download modules
        shell: bash
        working-directory: cli/src
        run: go mod download

      - name: Build CLI
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: '0'
        run: |
          OUT_DIR="build-output/${{ matrix.platform }}/${{ matrix.arch_dir }}"
          BIN="greenix-cli-v${VERSION_NAME}-${VERSION_CODE}${{ matrix.ext }}"
          mkdir -p "$OUT_DIR"
          cd cli/src
          go build -trimpath \
            -ldflags "-s -w -X main.Version=${VERSION_NAME} -X main.BuildCode=${VERSION_CODE} -X 'main.BuildDate=$(date -u '+%Y-%m-%d %H:%M:%S UTC')'" \
            -o "$GITHUB_WORKSPACE/$OUT_DIR/$BIN" .
          ls -lh "$GITHUB_WORKSPACE/$OUT_DIR"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: greenix-cli-${{ matrix.platform }}-${{ matrix.arch_dir }}
          path: build-output/${{ matrix.platform }}/${{ matrix.arch_dir }}/*
          if-no-files-found: error

  collect:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        shell: bash
        run: |
          source version.properties
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV
          echo "VERSION_CODE=$VERSION_CODE" >> $GITHUB_ENV

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Assemble build-output tree
        shell: bash
        run: |
          for dir in artifacts/greenix-cli-*; do
            name="$(basename "$dir")"
            rest="${name#greenix-cli-}"
            platform="${rest%-*}"
            arch="${rest##*-}"
            mkdir -p "build-output/$platform/$arch"
            cp -r "$dir"/* "build-output/$platform/$arch/"
          done
          find build-output -type f | sort

      - name: Upload combined build-output
        uses: actions/upload-artifact@v4
        with:
          name: build-output-v${{ env.VERSION_NAME }}-${{ env.VERSION_CODE }}
          path: build-output/**
          if-no-files-found: error

      - name: Commit build-output back to repository
        shell: bash
        run: |
          git config user.name "mood810"
          git config user.email "mahmoodkaliika810@gmail.com"
          BRANCH="${{ github.event.repository.default_branch }}"
          git fetch origin "$BRANCH"
          # keep the freshly assembled binaries while switching to the branch
          mv build-output "$RUNNER_TEMP/build-output"
          git checkout -B "$BRANCH" "origin/$BRANCH"
          rm -rf build-output
          mv "$RUNNER_TEMP/build-output" build-output
          git add -A -f build-output
          if git diff --cached --quiet; then
            echo "No changes in build-output"
          else
            git commit -m "ci: publish build-output for v${VERSION_NAME}-${VERSION_CODE}"
            git push origin "HEAD:$BRANCH"
          fi

      - name: Prepare release assets
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          # Release asset names must be unique, so flatten with platform/arch suffixes.
          mkdir -p release-assets
          find build-output -type f | while read -r f; do
            platform="$(echo "$f" | cut -d/ -f2)"
            arch="$(echo "$f" | cut -d/ -f3)"
            base="$(basename "$f")"
            name="${base%.exe}"
            ext=""
            [ "$base" != "$name" ] && ext=".exe"
            cp "$f" "release-assets/${name}-${platform}-${arch}${ext}"
          done
          ls -lh release-assets

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
